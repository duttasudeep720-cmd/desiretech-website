<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Free Marketplace Audit | DesireTech</title>
<meta name="description" content="Request a free DesireTech marketplace audit. Share your name, email, mobile number and brand or store link to get started.">
<style>
:root{--bg:#07111f;--panel:rgba(13,27,46,.9);--text:#f4f7fb;--muted:#9aabc0;--accent:#28b8ff;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#123452 0,#07111f 45%,#040a12 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(680px,calc(100% - 32px));margin:auto;padding:64px 0}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-size:12px;font-weight:800}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.3);backdrop-filter:blur(12px)}h1{font-size:clamp(38px,8vw,64px);line-height:.98;margin:12px 0 18px;letter-spacing:-.045em}p{color:var(--muted);line-height:1.6}.field{margin-top:18px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:15px 16px;border-radius:13px;border:1px solid var(--line);background:#081526;color:var(--text);outline:none;font:inherit}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(40,184,255,.12)}.btn{width:100%;margin-top:24px;padding:16px 18px;border:0;border-radius:13px;background:var(--accent);color:#04101b;font-weight:850;font-size:14px;cursor:pointer;transition:transform .15s ease,opacity .15s ease}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed}.status{min-height:24px;text-align:center;margin:14px 0 0;font-size:14px}.fine{font-size:12px;color:#71849a;text-align:center;margin-top:16px}@media(max-width:640px){.wrap{padding:40px 0}.card{padding:24px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="eyebrow">DesireTech Marketplace Audit</div>
  <h1>Let’s look at your marketplace growth.</h1>
  <p>Just 4 details. No long questionnaire. Share your details and brand or store link and we’ll take it from there.</p>
  <section class="card" aria-label="Free Marketplace Audit form">
    <form id="marketplace-audit-form" novalidate>
      <div class="field"><label for="audit-name">Name *</label><input id="audit-name" name="name" required autocomplete="name" placeholder="Your name"></div>
      <div class="field"><label for="audit-email">Email ID *</label><input id="audit-email" name="email" required type="email" autocomplete="email" placeholder="you@business.com"></div>
      <div class="field"><label for="audit-whatsapp">Mobile / WhatsApp Number *</label><input id="audit-whatsapp" name="whatsapp" required type="tel" inputmode="tel" autocomplete="tel" placeholder="Your mobile number"></div>
      <div class="field"><label for="audit-brand">Brand Name / Store Link *</label><input id="audit-brand" name="brand_or_store" required autocomplete="organization" placeholder="Brand name or marketplace store URL"></div>
      <button class="btn" id="audit-submit" type="submit">GET MY FREE MARKETPLACE AUDIT →</button>
      <p class="status" id="audit-status" role="status" aria-live="polite"></p>
    </form>
    <div class="fine">We only ask for the essentials needed to start.</div>
  </section>
</main>
<script>
/* Replace only with the public HTTPS n8n webhook URL when the local workflow is ready for production. */
const N8N_MARKETPLACE_AUDIT_WEBHOOK = 'PASTE_PUBLIC_N8N_WEBHOOK_URL_HERE';
const form=document.getElementById('marketplace-audit-form');
const button=document.getElementById('audit-submit');
const statusEl=document.getElementById('audit-status');
form.addEventListener('submit',async(event)=>{
  event.preventDefault(); statusEl.textContent='';
  if(!form.checkValidity()){form.reportValidity();statusEl.textContent='Please complete the required fields.';return;}
  const data=new FormData(form), brandOrStore=String(data.get('brand_or_store')||'').trim(), isUrl=/^https?:\/\//i.test(brandOrStore);
  const payload={name:String(data.get('name')||'').trim(),email:String(data.get('email')||'').trim().toLowerCase(),whatsapp:String(data.get('whatsapp')||'').trim(),brand:isUrl?'':brandOrStore,brand_name:isUrl?'':brandOrStore,store_url:isUrl?brandOrStore:'',source:'desiretech-website-marketplace-audit',source_url:window.location.href,landing_page:window.location.href,referrer:document.referrer||'',timestamp:new Date().toISOString()};
  if(payload.name.length<2){statusEl.textContent='Please enter your name.';return;}
  if(!/^\S+@\S+\.\S+$/.test(payload.email)){statusEl.textContent='Please enter a valid email address.';return;}
  if(payload.whatsapp.replace(/\D/g,'').length<7){statusEl.textContent='Please enter a valid mobile number.';return;}
  if(!brandOrStore){statusEl.textContent='Please enter your brand name or store link.';return;}
  button.disabled=true;button.textContent='SUBMITTING…';
  if(N8N_MARKETPLACE_AUDIT_WEBHOOK.startsWith('PASTE_')){statusEl.textContent='The form is ready, but the public n8n webhook is not connected yet.';button.disabled=false;button.textContent='GET MY FREE MARKETPLACE AUDIT →';return;}
  try{const response=await fetch(N8N_MARKETPLACE_AUDIT_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json().catch(()=>({}));if(!response.ok||result.success===false)throw new Error(result.message||'Submission failed');statusEl.textContent=result.message||'Thank you — your audit request has been received.';form.reset();}catch(error){statusEl.textContent='We could not send your request right now. Please try again or contact us on WhatsApp.';}finally{button.disabled=false;button.textContent='GET MY FREE MARKETPLACE AUDIT →';}
});
</script>
</body>
</html>
